<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1e24" media="(prefers-color-scheme: dark)">
  <title>GeoShelf</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="GeoShelf 첫 화면">
        <svg class="icon logo-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10A15.3 15.3 0 0 1 12 2z"/>
        </svg>
        <span class="logo-text">GeoShelf</span>
      </a>
      <nav class="nav" aria-label="주 메뉴">
        <a href="register.html" class="nav-link">도서 등록</a>
        <a href="admin.html" class="nav-link nav-link--admin">관리자</a>
        <div class="visitor-stats">
          <span>오늘 <strong id="todayCount">0</strong></span>
          <span>전체 <strong id="totalCount">0</strong></span>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1 class="hero-title">지리 도서를 한눈에</h1>
        <p class="hero-desc">수준과 내용으로 골라 보고, 서점으로 바로 가 보세요.</p>
        <div class="search-box">
          <svg class="icon search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
          </svg>
          <input type="search" id="searchInput" class="search-input" placeholder="도서명, 저자, 출판사, ISBN으로 찾기" aria-label="도서 찾기" autocomplete="off">
        </div>
      </div>
    </section>

    <section class="filter-section" aria-label="분류 고르기">
      <div class="container">
        <div class="filter-group filter-group--level-row">
          <div class="filter-group__left">
            <span class="filter-label">수준별</span>
            <div class="filter-chips" id="levelFilters">
              <button type="button" class="chip active" data-value="all">전체</button>
              <button type="button" class="chip" data-value="유·초등">유/초등</button>
              <button type="button" class="chip" data-value="중등">중등</button>
              <button type="button" class="chip" data-value="대학/임용">대학/임용</button>
              <button type="button" class="chip" data-value="교양">교양</button>
              <button type="button" class="chip chip-new" data-value="new" id="newBookFilter" aria-pressed="false"><span class="chip-dot" aria-hidden="true"></span>신간만</button>
            </div>
          </div>
          <div class="filter-group__right" id="projectFilterGroup" style="display:none;">
            <label class="filter-label" for="projectFilter">지정도서목록</label>
            <select class="project-select" id="projectFilter">
              <option value="all">전체 도서</option>
            </select>
          </div>
        </div>
        <div class="filter-group filter-group--content">
          <span class="filter-label">내용별</span>
          <div class="filter-chips-wrap">
            <div class="filter-chips" id="contentFilters">
              <button type="button" class="chip active" data-value="all">전체</button>
              <button type="button" class="chip chip-parent" data-value="자연지리" data-children="기후,지형">자연지리</button>
              <button type="button" class="chip chip-parent" data-value="인문지리" data-children="문화,역사,도시,촌락,인구,경제,정치">인문지리</button>
              <button type="button" class="chip" data-value="교육">교육</button>
              <button type="button" class="chip" data-value="지도·GIS">지도/GIS</button>
              <button type="button" class="chip" data-value="지역">지역</button>
              <button type="button" class="chip" data-value="사상">사상</button>
              <button type="button" class="chip" data-value="기타">기타</button>
            </div>
            <div class="filter-sub-chips" id="contentSubFilters" style="display:none;"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="results-section">
      <div class="container">
        <div class="results-header">
          <span class="result-count" aria-live="polite"><strong id="resultCount">0</strong>권</span>
          <select id="pageSize" class="page-size-select" aria-label="한 쪽에 보일 도서 수">
            <option value="10">10권씩 보기</option>
            <option value="20" selected>20권씩 보기</option>
            <option value="50">50권씩 보기</option>
          </select>
        </div>
        <div class="book-grid" id="bookGrid"></div>
        <div class="loading" id="loading">
          <div class="spinner" aria-hidden="true"></div>
          <p>도서를 불러오고 있어요</p>
        </div>
        <div class="empty-state" id="emptyState" style="display:none;">
          <div class="empty-icon">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
            </svg>
          </div>
          <p class="empty-title">찾는 도서가 없어요</p>
          <p class="empty-desc">검색어를 줄이거나 다른 분류를 골라 보세요.</p>
          <button type="button" class="btn btn-tonal" id="resetFilters">조건 모두 풀기</button>
        </div>
        <div class="empty-state" id="errorState" style="display:none;">
          <div class="empty-icon">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>
            </svg>
          </div>
          <p class="empty-title">도서 목록을 불러오지 못했어요</p>
          <p class="empty-desc">인터넷 연결을 확인하고 다시 시도해 주세요.</p>
          <button type="button" class="btn btn-tonal" id="retryLoad">다시 불러오기</button>
        </div>
        <nav class="pagination" id="pagination" aria-label="쪽 넘기기"></nav>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="bookModal">
    <div class="modal modal--wide" role="dialog" aria-modal="true" aria-label="도서 정보">
      <button type="button" class="modal-close" id="modalClose" aria-label="닫기">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="container footer-inner">
      <p class="copyright">2026 GeoShelf, 양정고등학교 지리교사 김용현, bgnlkim@gmail.com</p>
      <div data-bgnl-family></div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="https://bgnl.kr/family.js" defer></script>
</body>
</html>
