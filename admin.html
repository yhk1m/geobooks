<!DOCTYPE html>
<html lang="ko" data-density="compact">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1e24" media="(prefers-color-scheme: dark)">
  <title>관리자 - GeoShelf</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="GeoShelf 첫 화면">
        <svg class="icon logo-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10A15.3 15.3 0 0 1 12 2z"/>
        </svg>
        <span class="logo-text">GeoShelf</span>
      </a>
      <nav class="nav" aria-label="주 메뉴">
        <a href="index.html" class="nav-link">도서 목록</a>
        <a href="register.html" class="nav-link">도서 등록</a>
      </nav>
    </div>
  </header>

  <main class="page-section">
    <div class="container">
      <!-- 로그인 -->
      <div id="loginSection" class="admin-login">
        <div class="admin-login-box">
          <h1 class="page-title">관리자 로그인</h1>
          <p class="page-desc">로그인하면 등록 요청을 확인하고 도서 정보를 고칠 수 있어요.</p>
          <div class="form-group">
            <label class="form-label" for="adminPassword">비밀번호</label>
            <input type="password" id="adminPassword" class="form-input" autocomplete="current-password">
          </div>
          <button type="button" id="loginBtn" class="btn btn-primary btn-block">로그인</button>
          <p class="error-msg" id="loginError" role="alert" style="display:none;"></p>
        </div>
      </div>

      <div id="adminPanel" style="display:none;">
        <!-- 확인할 등록 요청 -->
        <section class="admin-block">
          <div class="admin-header">
            <div>
              <h1 class="page-title">등록 요청</h1>
              <p class="admin-summary" id="pendingCount"></p>
            </div>
            <div class="admin-actions">
              <button type="button" id="refreshBtn" class="btn btn-outline">새로고침</button>
              <button type="button" id="logoutBtn" class="btn btn-ghost">로그아웃</button>
            </div>
          </div>

          <div class="loading" id="adminLoading" style="display:none;">
            <div class="spinner" aria-hidden="true"></div>
            <p>불러오고 있어요</p>
          </div>
          <p class="admin-empty" id="adminEmpty" style="display:none;">새 등록 요청이 오면 여기에 보여요.</p>
          <div class="book-list book-list--todo" id="pendingList"></div>
        </section>

        <!-- 등록 도서 -->
        <section class="admin-block">
          <div class="admin-header">
            <div>
              <h2 class="page-title">등록 도서</h2>
              <p class="admin-summary" id="booksCount"></p>
            </div>
          </div>

          <div class="admin-search-box">
            <input type="search" id="adminSearchInput" class="form-input" placeholder="도서명, 저자, 출판사, ISBN으로 찾기" aria-label="등록 도서 찾기" autocomplete="off">
          </div>

          <div class="loading" id="booksLoading" style="display:none;">
            <div class="spinner" aria-hidden="true"></div>
            <p>불러오고 있어요</p>
          </div>
          <p class="admin-empty" id="booksEmpty" style="display:none;">찾는 도서가 없어요. 검색어를 줄여 보세요.</p>
          <div class="book-list" id="booksList"></div>
        </section>
      </div>
    </div>
  </main>

  <!-- 수정 대화상자 -->
  <div class="modal-overlay" id="editModal">
    <div class="modal modal--wide" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
      <button type="button" class="modal-close" id="editModalClose" aria-label="닫기">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="modal-body">
        <h2 class="page-title" id="editModalTitle" style="margin-bottom: var(--sp-5);">도서 정보 고치기</h2>
        <form id="editForm" class="form">
          <input type="hidden" id="editId">
          <input type="hidden" id="editSheet">
          <div class="form-group">
            <label class="form-label" for="editTitle">도서명</label>
            <input type="text" id="editTitle" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="editSubtitle">부제</label>
            <input type="text" id="editSubtitle" class="form-input">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="editAuthor">저자</label>
              <input type="text" id="editAuthor" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="editPublisher">출판사</label>
              <input type="text" id="editPublisher" class="form-input" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="editPubDate">출판일</label>
              <input type="date" id="editPubDate" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label" for="editIsbn">ISBN(13)</label>
              <input type="text" id="editIsbn" class="form-input" maxlength="13" inputmode="numeric">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="editLevel">수준별</label>
              <select id="editLevel" class="form-select" required>
                <option value="유·초등">유/초등</option>
                <option value="중등">중등</option>
                <option value="대학/임용">대학/임용</option>
                <option value="교양">교양</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="editContent">내용별</label>
              <select id="editContent" class="form-select" required>
                <optgroup label="자연지리">
                  <option value="자연지리">자연지리 전체</option>
                  <option value="기후">기후</option>
                  <option value="지형">지형</option>
                </optgroup>
                <optgroup label="인문지리">
                  <option value="인문지리">인문지리 전체</option>
                  <option value="문화">문화</option>
                  <option value="역사">역사</option>
                  <option value="도시">도시</option>
                  <option value="촌락">촌락</option>
                  <option value="인구">인구</option>
                  <option value="경제">경제</option>
                  <option value="정치">정치</option>
                </optgroup>
                <optgroup label="그 밖의 분류">
                  <option value="교육">교육</option>
                  <option value="지도·GIS">지도/GIS</option>
                  <option value="지역">지역</option>
                  <option value="사상">사상</option>
                  <option value="기타">기타</option>
                </optgroup>
              </select>
            </div>
          </div>

          <h3 class="form-section-title">서점 링크</h3>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label form-label--sub" for="editLinkKyobo">교보문고</label>
              <input type="url" id="editLinkKyobo" class="form-input" placeholder="https://">
            </div>
            <div class="form-group">
              <label class="form-label form-label--sub" for="editLinkYes24">Yes24</label>
              <input type="url" id="editLinkYes24" class="form-input" placeholder="https://">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label form-label--sub" for="editLinkAladin">알라딘</label>
              <input type="url" id="editLinkAladin" class="form-input" placeholder="https://">
            </div>
            <div class="form-group">
              <label class="form-label form-label--sub" for="editLinkEtc">그 밖의 서점</label>
              <input type="url" id="editLinkEtc" class="form-input" placeholder="https://">
            </div>
          </div>

          <h3 class="form-section-title">지정도서목록</h3>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label form-label--sub" for="editProject1">목록 1</label>
              <input type="text" id="editProject1" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label form-label--sub" for="editProject2">목록 2</label>
              <input type="text" id="editProject2" class="form-input">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label form-label--sub" for="editProject3">목록 3</label>
              <input type="text" id="editProject3" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label form-label--sub" for="editProject4">목록 4</label>
              <input type="text" id="editProject4" class="form-input">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label form-label--sub" for="editProject5">목록 5</label>
              <input type="text" id="editProject5" class="form-input">
            </div>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn btn-danger" id="editDangerBtn">목록에서 빼기</button>
            <span class="spacer"></span>
            <button type="submit" class="btn btn-primary" id="editSubmitBtn">고친 내용 저장</button>
            <button type="button" class="btn btn-primary" id="editApproveBtn" style="display:none;">승인하기</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 확인 대화상자 -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal modal--sm" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMsg">
      <div class="modal-body">
        <h2 class="confirm-title" id="confirmTitle"></h2>
        <p class="confirm-desc" id="confirmMsg"></p>
        <div class="confirm-actions">
          <button type="button" id="confirmNo" class="btn btn-outline">닫기</button>
          <button type="button" id="confirmYes" class="btn btn-primary">확인</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer class="footer">
    <div class="container footer-inner">
      <p class="copyright">2026 GeoShelf, 양정고등학교 지리교사 김용현, bgnlkim@gmail.com</p>
      <div data-bgnl-family></div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
  <script src="https://bgnl.kr/family.js" defer></script>
</body>
</html>
